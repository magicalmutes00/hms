spring:
  application:
    name: hotel-management-system
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/hms?sslmode=require}
    username: ${PGUSER:postgres}
    password: ${PGPASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 10000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    default-schema: public
    baseline-on-migrate: true
  security:
    oauth2:
      resourceserver:
        jwt:
          # Neon Auth signs with the EdDSA/Ed25519 key served at <auth-url>/jwks.
          # Only jwk-set-uri is configured — Managed Better Auth JWTs carry no `iss`
          # claim, so an issuer-uri would reject every valid token at decode time.
          # Signature (EdDSA) and expiry are still strictly enforced via JWKS.
          # If your instance adds `iss`, set spring.security.oauth2.resourceserver.jwt.issuer-uri.
          jwk-set-uri: ${NEON_JWKS_URL:${NEON_AUTH_URL:http://localhost:3000/api/auth}/jwks}

server:
  port: ${PORT:8080}
  error:
    include-message: always

neon:
  storage:
    endpoint: ${NEON_S3_ENDPOINT:https://s3.neon.example.com}
    region: ${NEON_S3_REGION:us-east-1}
    access-key: ${NEON_S3_ACCESS_KEY:changeme}
    secret-key: ${NEON_S3_SECRET_KEY:changeme}
    bucket: ${NEON_S3_BUCKET:hms-assets}
    public-base-url: ${NEON_S3_PUBLIC_URL:}
    presign-expiry-minutes: 15
    force-path-style: true

app:
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173}
  booking:
    code-length: 8
    max-nights: 90

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized
  health:
    probes:
      enabled: true
